name: CI

# Tests only. Nothing in this workflow publishes or deploys; releases are manual
# (see "Publishing" in README.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, build, SSR, pack (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/generate-fixtures.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:ssr
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pack

  ssr-node-20:
    name: Package runtime on Node 20 (SSR import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ssr

  browsers:
    name: Browser tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Hosted runners have no sound device. Without one, Firefox and WebKit
      # keep the AudioContext suspended and the component (correctly) reports
      # "blocked". A virtual PulseAudio sink lets real audio flow so the tests
      # can measure it.
      - name: Start virtual audio sink
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-and-screenshots
          path: |
            playwright-report/
            test-results/screenshots/
          retention-days: 14
